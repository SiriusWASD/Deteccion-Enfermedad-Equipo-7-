<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso - Sistema Experto</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 h-screen flex items-center justify-center">
    <div class="bg-white p-8 rounded-xl shadow-lg w-96 border-t-4 border-blue-600">
        <h2 class="text-2xl font-bold mb-2 text-center text-slate-800">Bienvenido</h2>
        <p class="text-sm text-center text-slate-500 mb-6">Sistema de Detección de Riesgo</p>

        <!-- Bloque de Mensajes (Error o Éxito) -->
        {% if mensaje %}
            <div class="p-3 rounded mb-4 text-sm text-center 
                {% if 'éxito' in mensaje.lower() or 'creada' in mensaje.lower() %}
                    bg-green-100 text-green-700
                {% else %}
                    bg-red-100 text-red-700
                {% endif %}">
                {{ mensaje }}
            </div>
        {% endif %}

        <form action="/login" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-slate-700">Correo Electrónico</label>
                <input type="email" name="correo" required 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <div>
                <label class="block text-sm font-semibold text-slate-700">Contraseña</label>
                <input type="password" name="password" required 
                    class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg shadow-md transition">
                Entrar al Sistema
            </button>
        </form>

        <div class="mt-6 pt-4 border-t border-slate-100 text-center">
            <p class="text-sm text-slate-600">
                ¿No tienes una cuenta? 
                <a href="/registro" class="text-blue-600 font-bold hover:underline">Regístrate aquí</a>
            </p>
        </div>
    </div>
</body>
</html>
